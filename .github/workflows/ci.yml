name: CI

# Master prompt Fase 21: push -> lint -> type check -> unit tests ->
# integration tests -> physics regression -> small benchmark, with the
# heavy jobs (physics/integration/benchmark) NOT blocking the fast unit
# job's own pass/fail signal -- "Os benchmarks completos nao devem
# bloquear testes rapidos."

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff pytest
      - name: Ruff critical correctness checks (blocking)
        run: ruff check . --select E9,F63,F7,F82
      - name: Test dependency-free security source scanner
        run: python -m pytest -q tests/test_security_source_scan.py
      - name: Scan security source literals without exposing values
        run: python tools/check_security_sources.py --output outputs/security/source-scan.json
      - name: Ruff style report (advisory during migration)
        run: ruff check src tests --output-format=github || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install type-check tools
        run: pip install mypy
      - name: Mypy type check (non-blocking; this project predates comprehensive type annotations)
        run: mypy --ignore-missing-imports . || true

  dashboard-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint dashboard
        run: pnpm lint
      - name: Build dashboard
        run: pnpm build

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: pip install -e ".[analysis,dev,satellite]" --break-system-packages
      - name: Restore hash-pinned runtime fixtures
        run: python tools/prepare_console_resources.py
      - name: Run unit tests (fast, isolated)
        run: pytest -m unit -q
      - name: Validate portable TCC scientific claims
        run: python experiments/validate_tcc_claims.py --output-dir outputs/tcc-claim-validation

  security-windows:
    runs-on: windows-latest
    needs: [lint]
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security and native test dependencies
        run: python -m pip install -e ".[analysis,dev,console,lab,satellite]"
      - name: Restore hash-pinned runtime fixtures
        run: python tools/prepare_console_resources.py
      - name: Exercise identities, PKI, replay, recovery and equipment authority
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force outputs/security-ci | Out-Null
          python -m pytest -q tests/test_security_core.py tests/test_security_console.py tests/test_security_application.py tests/test_security_pki_keys.py tests/test_security_protocol_equipment.py tests/test_security_ogs.py --basetemp outputs/security-ci/pytest --junitxml outputs/security-ci/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-windows-evidence
          path: outputs/security-ci/tests.xml

  qnet-packages:
    # The author's two qnet_autopilot versions (src/qnet_network, src/qnet_qkd) and
    # their own test suites, against the SeQUeNCe commit current when they were built.
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      SEQUENCE_SRC: ${{ github.workspace }}/external/sequence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: pip install -e ".[analysis,dev]" --break-system-packages
      - name: Fetch SeQUeNCe 3133c66d (master on 2026-09-13)
        run: |
          git clone -q https://github.com/sequence-toolbox/SeQUeNCe.git external/sequence
          git -C external/sequence checkout -q 3133c66d
      - name: qnet_network suite (author's tests)
        working-directory: external/qnet_network
        run: python -m pytest -q -o addopts=""
      - name: qnet_qkd suite (author's tests)
        working-directory: external/qnet_qkd
        run: python -m pytest -q -o addopts=""

  physics-regression:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: pip install -e ".[analysis,dev]" --break-system-packages
      - name: Restore hash-pinned runtime fixtures
        run: python tools/prepare_console_resources.py
      - name: Run physics validation + regression tests
        run: pytest -m physics -q

  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: pip install -e ".[analysis,dev]" --break-system-packages
      - name: Restore hash-pinned runtime fixtures
        run: python tools/prepare_console_resources.py
      - name: Run integration tests (multi-component, end-to-end)
        run: pytest -m integration -q

  statistical-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: pip install -e ".[analysis,dev]" --break-system-packages
      - name: Restore hash-pinned runtime fixtures
        run: python tools/prepare_console_resources.py
      - name: Run statistical methodology tests (hypothesis/equivalence testing, coverage/calibration)
        run: pytest -m statistical -q

  small-benchmark:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: pip install -e ".[analysis,dev]" --break-system-packages
      - name: Small Edge AI benchmark smoke test (not the full 500-rep suite)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'experiments')  # one-hundred-ninth addendum: run_*.py scripts moved here
          from run_edge_ai_benchmark import benchmark_inference_latency, FlattenMLP
          import torch
          model = FlattenMLP(input_size=16, window_size=20)
          x = torch.rand(1, 20, 16)
          result = benchmark_inference_latency(model, x, n_reps=20, n_warmup=5)
          print('Benchmark smoke test OK:', result)
          "

  # NOTE: the "slow" marker (multi-seed sweeps, dense parameter grids) is
  # intentionally NOT run in this CI pipeline at all -- those tests exist
  # for local/manual validation before a release, not for every push.
  # Run them explicitly with `pytest -m slow` when needed.
