[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-twin"
version = "5.60.0"
description = "WDM-informed quantum repeater digital twin with explicit data provenance, predictive admission control, and simulation validation."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0,<3",
  "qiskit>=1.0,<3",
  "qiskit-aer>=0.14,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "scipy>=1.11",
  "networkx>=3.0",
  "cryptography>=43,<51",
]

[project.scripts]
orionq = "quantum_autopilot.desktop:main"
orion-q-security = "quantum_autopilot.security.cli:main"
orion-q-satellite-gateway = "quantum_autopilot.quantum_protocols.satellite_gateway_cli:main"
orion-q-temporal-campaign = "quantum_autopilot.control_plane.temporal_campaign_cli:main"
orion-q = "quantum_autopilot.desktop:main"
orion-q-lab = "quantum_autopilot.lab.cli:main"
orion-q-diagnose-runtime = "quantum_autopilot.control_plane.runtime_diagnostic:main"
orion-q-compare-controllers = "quantum_autopilot.control_plane.controller_evidence:main"
orion-q-laboneq-emulation = "quantum_autopilot.integrations.laboneq.emulation:main"
quantum-twin-desktop = "quantum_autopilot.desktop:main"
quantum-twin-console = "quantum_autopilot.desktop:main"

[project.optional-dependencies]
lab = ["cryptography>=43,<51"]
satellite = [
  "sgp4>=2.25,<3",
  "websockets>=15,<18",
]
console = ["PySide6>=6.6,<7"]
laboneq-emulation = ["laboneq[xarray]==26.7.0", "xarray==2026.9.0"]
analysis = [
  "matplotlib>=3.8,<4",
  "xgboost>=2,<4",
  "statsmodels>=0.14,<1",
  "pyinform>=0.2,<1",
  "pyarrow>=14,<24",
]
dev = [
  "pytest>=7,<10",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]
desktop = [
  "pyinstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quantum_autopilot.console" = ["assets/*.ico", "assets/*.png", "assets/*.wav", "fonts/*.ttf", "fonts/*.otf", "fonts/*-OFL.txt", "fonts/*-NOTICE.txt", "fonts/*.json", "geo/*.json", "geo/*.md"]
"quantum_autopilot.qkd" = ["data/*.json"]
"quantum_autopilot.model_intake" = ["derived/*.json", "derived/*.npz"]
"quantum_autopilot.control_plane" = ["data/*.json"]
"quantum_autopilot.quantum_protocols" = ["data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"
# Author's vendored qnet_autopilot versions are kept as delivered (see external/VENDORED.json).
extend-exclude = ["src/qnet_network", "src/qnet_qkd", "external"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
